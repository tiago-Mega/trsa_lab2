# Direct /cmd_vel -> Gazebo DiffDrive; Nav2 Collision Monitor is the final autonomous publisher.
# Teleop uses /cmd_vel directly and must not operate concurrently with Nav2.
# Raw wheel odometry is conditioned, then fused. NO Gazebo TF is bridged.
# wheel_odom_interface publishes /odom and odom -> base_footprint in wheel-only mode.
# /imu remains available as the original sensor stream; /imu/data is the EKF input.
- ros_topic_name: /clock
  gz_topic_name: /world/amazon_warehouse/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/logistic_robot/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /wheel/odom_raw
  gz_topic_name: /model/logistic_robot/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /model/logistic_robot/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /joint_states
  gz_topic_name: /model/logistic_robot/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /scan
  gz_topic_name: /model/logistic_robot/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /imu
  gz_topic_name: /model/logistic_robot/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /lift/command
  gz_topic_name: /model/logistic_robot/lift/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
